<svg xmlns="http://www.w3.org/2000/svg" style="display:none;" shape-rendering="crispEdges">
  <defs>
    <!-- Pixel Heart -->
    <g id="px-heart">
      <path d="M4 1h4v2H4V1zm8 0h4v2h-4V1zM2 3h2v4H2V3zm16 0h2v4h-2V3zM4 7h2v2H4V7zm12 0h2v2h-2V7zM6 9h2v2H6V9zm8 0h2v2h-2V9zM8 11h4v2H8v-2z" fill="#d84b72"/>
      <path d="M4 3h4v4H4V3zm8 0h4v4h-4V3zm-6 4h8v2H6V7zm2 2h4v2H8V9z" fill="#ff769d"/>
      <rect x="4" y="3" width="2" height="2" fill="#ffa1b9"/>
    </g>

    <!-- Pixel Star / Stardrop -->
    <g id="px-star">
      <path d="M9 1h2v2H9V1zm-2 2h6v2H7V3zM1 7h18v2H1V7zm3 2h14v2H4V9zm2 2h10v2H6v-2zm-2 2h4v2H4v-2zm10 0h4v2h-4v-2zm-2 2h2v2h-2v-2z" fill="#ca8a04"/>
      <path d="M9 3h2v4H9V3zm-6 4h14v2H3V7zm3 2h8v2H6V9zm-1 2h3v2H5v-2zm7 0h3v2h-3v-2z" fill="#facc15"/>
      <rect x="8" y="4" width="2" height="2" fill="#fef08a"/>
    </g>

    <!-- Pixel Scroll / Resume -->
    <g id="px-scroll">
      <path d="M3 2h12v2H3V2zm-1 2h14v12H2V4zm2 12h12v2H4v-2z" fill="#9e6634"/>
      <rect x="3" y="3" width="12" height="12" fill="#fff1db"/>
      <rect x="5" y="5" width="8" height="1" fill="#c49567"/>
      <rect x="5" y="7" width="8" height="1" fill="#c49567"/>
      <rect x="5" y="9" width="6" height="1" fill="#c49567"/>
      <rect x="5" y="11" width="8" height="1" fill="#c49567"/>
      <rect x="12" y="11" width="2" height="2" fill="#d84b72"/>
    </g>

    <!-- Pixel Autoinjector / Medical Device -->
    <g id="px-injector">
      <path d="M2 17l6-6 2 2-6 6-2-2z" fill="#94a3b8"/>
      <path d="M1 18l1-1 1 1-1 1-1-1z" fill="#64748b"/>
      <path d="M8 11l6-6 3 3-6 6-3-3z" fill="#f472b6"/>
      <path d="M13 6l2-2 2 2-2 2-2-2z" fill="#f9a8d4"/>
      <rect x="14" y="3" width="3" height="3" fill="#cbd5e1"/>
      <line x1="1" y1="19" x2="0" y2="20" stroke="#475569" stroke-width="1"/>
    </g>

    <!-- Pixel Laboratory Flask -->
    <g id="px-flask">
      <path d="M7 1h6v2H7V1zm2 2h2v4H9V3zm-5 8h12v2H4v-2zm-1 2h14v4H3v-4zm2 4h10v1H5v-1z" fill="#713f5c"/>
      <path d="M8 2h4v1H8V2zm1 2h2v3H9V4zm-4 8h10v3H5v-3z" fill="#f472b6"/>
      <rect x="4" y="13" width="12" height="4" fill="#fb7185"/>
      <rect x="6" y="14" width="2" height="2" fill="#ffffff" opacity="0.6"/>
      <rect x="11" y="15" width="1" height="1" fill="#ffffff" opacity="0.6"/>
    </g>

    <!-- Pixel Shield / Compliance -->
    <g id="px-shield">
      <path d="M3 2h14v3H3V2zm0 3h2v7H3V5zm12 0h2v7h-2V5zm-2 7h2v3h-2v-3zm-8 0h2v3H5v-3zm2 3h6v2H7v-2z" fill="#4a2135"/>
      <rect x="5" y="3" width="10" height="9" fill="#fce7f3"/>
      <path d="M7 7l2 2 4-4" stroke="#e11d48" stroke-width="2" fill="none"/>
    </g>

    <!-- Pixel Mail / Letter -->
    <g id="px-mail">
      <path d="M2 3h16v12H2V3z" fill="#8d5b36"/>
      <rect x="3" y="4" width="14" height="10" fill="#fffbf5"/>
      <path d="M3 4l7 5 7-5" stroke="#c49567" stroke-width="1" fill="none"/>
      <!-- Pink heart wax seal -->
      <rect x="9" y="8" width="2" height="2" fill="#e11d48"/>
    </g>

    <!-- Pixel Clock / Sun -->
    <g id="px-sun">
      <rect x="7" y="1" width="2" height="2" fill="#f59e0b"/>
      <rect x="7" y="13" width="2" height="2" fill="#f59e0b"/>
      <rect x="1" y="7" width="2" height="2" fill="#f59e0b"/>
      <rect x="13" y="7" width="2" height="2" fill="#f59e0b"/>
      <rect x="4" y="4" width="8" height="8" fill="#fbbf24"/>
      <rect x="5" y="5" width="6" height="6" fill="#fef08a"/>
    </g>

    <!-- Pixel Moon -->
    <g id="px-moon">
      <path d="M6 2h5v2H6V2zm5 2h3v3h-3V4zm2 3h2v4h-2V7zm-2 4h3v3h-3v-3zm-5 3h5v2H6v-2z" fill="#c084fc"/>
      <rect x="7" y="4" width="3" height="8" fill="#e9d5ff"/>
    </g>

    <!-- Pixel Checkmark -->
    <g id="px-check">
      <path d="M2 6l3 3 7-7" stroke="#16a34a" stroke-width="2" fill="none"/>
    </g>

    <!-- Pixel Gold Coin -->
    <g id="px-coin">
      <rect x="4" y="2" width="8" height="12" fill="#ca8a04"/>
      <rect x="2" y="4" width="12" height="8" fill="#ca8a04"/>
      <rect x="4" y="4" width="8" height="8" fill="#facc15"/>
      <rect x="6" y="5" width="2" height="6" fill="#fef08a"/>
      <rect x="8" y="7" width="2" height="2" fill="#ca8a04"/>
    </g>
  </defs>
</svg>
