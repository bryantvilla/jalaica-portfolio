    <!-- Briefcase / Work -->
    <g id="px-work" viewBox="0 0 16 16">
      <path d="M5 2h6v2H5V2zM2 4h12v2H2V4zm-1 2h14v8H1V6zm3 2v4h8V8H4zm2 1h4v2H6V9z" fill="currentColor"/>
    </g>

    <!-- Toolkit / Skills -->
    <g id="px-skills" viewBox="0 0 16 16">
      <path d="M2 2h4v4H2V2zm8 0h4v4h-4V2zM2 10h4v4H2v-4zm8 0h4v4h-4v-4z" fill="currentColor"/>
      <rect x="3" y="3" width="2" height="2" fill="var(--pink-vibrant)"/>
      <rect x="11" y="3" width="2" height="2" fill="var(--pink-vibrant)"/>
      <rect x="3" y="11" width="2" height="2" fill="var(--pink-vibrant)"/>
      <rect x="11" y="11" width="2" height="2" fill="var(--pink-vibrant)"/>
    </g>

    <!-- Project / Blueprint -->
    <g id="px-project" viewBox="0 0 16 16">
