    </g>

    <!-- Shield / Quality & ISO Standards -->
    <g id="px-shield" viewBox="0 0 16 16">
      <path d="M2 1h12v4H2V1zm0 4h2v6H2V5zm10 0h2v6h-2V5zm-8 6h6v2H4v-2zm2 2h2v2H6v-2z" fill="currentColor"/>
      <path d="M5 6l2 2 4-4" stroke="var(--pink-vibrant)" stroke-width="2" fill="none"/>
    </g>

    <!-- Laboratory Flask / Analytical Testing -->
    <g id="px-flask" viewBox="0 0 16 16">
      <path d="M6 1h4v2H6V1zm1 2h2v4H7V3zm-4 7h10v2H3v-2zm-1 2h12v3H2v-3z" fill="currentColor"/>
      <rect x="4" y="11" width="8" height="3" fill="var(--pink-vibrant)"/>
      <rect x="5" y="12" width="2" height="1" fill="#ffffff" opacity="0.6"/>
    </g>

    <!-- Gear / Engineering & Process Optimization -->
    <g id="px-gear" viewBox="0 0 16 16">
      <path d="M6 1h4v2H6V1zm-4 5h2v4H2V6zm10 0h2v4h-2V6zm-6 7h4v2H6v-2zm-2-9h2v2H4V4zm6 0h2v2h-2V4zm-6 6h2v2H4v-2zm6 0h2v2h-2v-2z" fill="currentColor"/>
      <rect x="6" y="6" width="4" height="4" fill="var(--pink-vibrant)"/>
    </g>

    <!-- Chart / Statistical Process & Metrics -->
    <g id="px-chart" viewBox="0 0 16 16">
      <path d="M1 1h2v12h12v2H1V1zm4 8h2v3H5V9zm4-4h2v7H9V5zm4-3h2v10h-2V2z" fill="currentColor"/>
    </g>

