<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 84 76" width="84" height="76" shape-rendering="crispEdges">
  <!-- Roman Triangular Pediment Roof (Gold & Cream) -->
  <rect x="41" y="4" width="2" height="3" fill="#f59e0b"/>
  <rect x="37" y="7" width="10" height="3" fill="#fef3c7"/>
  <rect x="33" y="10" width="18" height="3" fill="#fffbeb"/>
  <rect x="28" y="13" width="28" height="3" fill="#fef3c7"/>
  <rect x="22" y="16" width="40" height="4" fill="#fffbeb"/>
  <rect x="16" y="20" width="52" height="4" fill="#fef3c7"/>
  <!-- Tympanum Relief Medallion -->
  <rect x="39" y="13" width="6" height="5" fill="#f59e0b"/>
  <rect x="41" y="14" width="2" height="3" fill="#fef08a"/>

  <!-- Classical Architrave & Entablature -->
  <rect x="14" y="24" width="56" height="4" fill="#fef3c7"/>
  <rect x="12" y="28" width="60" height="3" fill="#fde68a"/>

  <!-- Classical Roman Fluted Columns (6 Columns across front) -->
  <!-- Col 1 -->
  <rect x="16" y="31" width="4" height="24" fill="#ffffff"/>
  <rect x="15" y="31" width="1" height="24" fill="#fed7aa"/>
  <!-- Col 2 -->
  <rect x="25" y="31" width="4" height="24" fill="#ffffff"/>
  <!-- Col 3 -->
  <rect x="34" y="31" width="4" height="24" fill="#ffffff"/>
  <!-- Central Grand Entrance Portal between cols 3 & 4 -->
  <rect x="39" y="34" width="6" height="21" fill="#451a03"/>
  <rect x="40" y="36" width="4" height="19" fill="#1c1917"/>
  <!-- Col 4 -->
  <rect x="46" y="31" width="4" height="24" fill="#ffffff"/>
  <!-- Col 5 -->
  <rect x="55" y="31" width="4" height="24" fill="#ffffff"/>
  <!-- Col 6 -->
  <rect x="64" y="31" width="4" height="24" fill="#ffffff"/>
  <rect x="68" y="31" width="1" height="24" fill="#fb923c"/>

  <!-- Grand Marble Terrace Steps -->
  <rect x="10" y="55" width="64" height="4" fill="#fef3c7"/>
  <rect x="8" y="59" width="68" height="4" fill="#fed7aa"/>
  <rect x="6" y="63" width="72" height="4" fill="#fdba74"/>
  <rect x="4" y="67" width="76" height="5" fill="#fb923c"/>

  <!-- Golden Lions of Leah Guarding the Steps (Left & Right) -->
  <!-- Left Lion -->
  <rect x="8" y="47" width="5" height="8" fill="#f59e0b"/>
  <rect x="7" y="49" width="7" height="5" fill="#fbbf24"/>
  <rect x="9" y="45" width="3" height="3" fill="#d97706"/>
  <rect x="10" y="46" width="1" height="1" fill="#fef08a"/>
  <!-- Right Lion -->
  <rect x="71" y="47" width="5" height="8" fill="#f59e0b"/>
  <rect x="70" y="49" width="7" height="5" fill="#fbbf24"/>
  <rect x="72" y="45" width="3" height="3" fill="#d97706"/>
  <rect x="73" y="46" width="1" height="1" fill="#fef08a"/>
</svg>