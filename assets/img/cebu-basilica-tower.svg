<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 110" width="72" height="110" shape-rendering="crispEdges">
  <!-- Spire Cross -->
  <rect x="35" y="2" width="2" height="12" fill="#f59e0b"/>
  <rect x="31" y="5" width="10" height="3" fill="#f59e0b"/>
  <rect x="35" y="5" width="2" height="3" fill="#fef08a"/>

  <!-- Cupola / Domed Roof -->
  <rect x="33" y="14" width="6" height="3" fill="#e11d48"/>
  <rect x="29" y="17" width="14" height="3" fill="#fb7185"/>
  <rect x="26" y="20" width="20" height="4" fill="#e11d48"/>
  <rect x="24" y="24" width="24" height="4" fill="#be123c"/>
  <rect x="22" y="28" width="28" height="3" fill="#881337"/>

  <!-- Upper Belfry Stage with Arched Windows and Bell -->
  <rect x="24" y="31" width="24" height="2" fill="#fef3c7"/>
  <rect x="22" y="33" width="28" height="26" fill="#fed7aa"/>
  <rect x="24" y="35" width="4" height="22" fill="#fff7ed"/>
  <rect x="44" y="35" width="4" height="22" fill="#ea580c"/>
  
  <!-- Belfry Arch opening -->
  <rect x="31" y="37" width="10" height="4" fill="#451a03"/>
  <rect x="29" y="41" width="14" height="16" fill="#451a03"/>
  
  <!-- Bronze Church Bell (Kampana) inside arch -->
  <rect x="34" y="41" width="4" height="2" fill="#78350f"/>
  <rect x="33" y="43" width="6" height="6" fill="#d97706"/>
  <rect x="32" y="49" width="8" height="3" fill="#f59e0b"/>
  <rect x="34" y="44" width="2" height="6" fill="#fef08a"/>
  <rect x="35" y="52" width="2" height="3" fill="#78350f"/>

  <!-- Cornice & Urns between stages -->
  <rect x="18" y="59" width="36" height="4" fill="#fef3c7"/>
  <rect x="16" y="63" width="40" height="3" fill="#d97706"/>
  <!-- Finial Urns on corners -->
  <rect x="18" y="54" width="4" height="5" fill="#f59e0b"/>
  <rect x="50" y="54" width="4" height="5" fill="#ea580c"/>

  <!-- Middle Baroque Stage with Relief Details -->
  <rect x="18" y="66" width="36" height="24" fill="#ffedd5"/>
  <!-- Corner pilasters -->
  <rect x="18" y="66" width="5" height="24" fill="#fff7ed"/>
  <rect x="49" y="66" width="5" height="24" fill="#ea580c"/>
  <!-- Central relief niche / coat of arms -->
  <rect x="31" y="70" width="10" height="14" fill="#fdba74"/>
  <rect x="33" y="72" width="6" height="10" fill="#e11d48"/>
  <rect x="35" y="74" width="2" height="6" fill="#fef08a"/>

  <!-- Lower Base Stage & Stone Plinth -->
  <rect x="14" y="90" width="44" height="4" fill="#fef3c7"/>
  <rect x="12" y="94" width="48" height="10" fill="#fdba74"/>
  <rect x="12" y="94" width="6" height="10" fill="#fff7ed"/>
  <rect x="54" y="94" width="6" height="10" fill="#c2410c"/>
  <!-- Arched base entrance / door -->
  <rect x="31" y="96" width="10" height="8" fill="#78350f"/>
  <rect x="33" y="97" width="6" height="7" fill="#451a03"/>

  <!-- Foundation Steps -->
  <rect x="8" y="104" width="56" height="3" fill="#fed7aa"/>
  <rect x="6" y="107" width="60" height="3" fill="#b45309"/>

  <!-- Climbing Pink Bougainvillea on coral stones -->
  <rect x="14" y="72" width="3" height="3" fill="#f43f5e"/>
  <rect x="16" y="75" width="2" height="2" fill="#22c55e"/>
  <rect x="13" y="77" width="3" height="3" fill="#fb7185"/>
  <rect x="15" y="81" width="3" height="3" fill="#f43f5e"/>
  <rect x="12" y="84" width="2" height="2" fill="#15803d"/>
  <rect x="14" y="88" width="3" height="3" fill="#fda4af"/>
</svg>