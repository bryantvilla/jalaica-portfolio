<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 68 104" width="68" height="104" shape-rendering="crispEdges">
  <!-- Chief Lapu-Lapu Bronze Warrior Figure -->
  <!-- Feathered / Gold Visayan Chieftain Headband (Pukol) -->
  <rect x="31" y="4" width="8" height="3" fill="#f59e0b"/>
  <rect x="33" y="1" width="3" height="4" fill="#dc2626"/>
  <!-- Face & Hair -->
  <rect x="32" y="7" width="6" height="6" fill="#b45309"/>
  <rect x="30" y="6" width="2" height="7" fill="#1e293b"/>
  <rect x="38" y="6" width="2" height="7" fill="#1e293b"/>

  <!-- Muscular Bronze Torso with Gold Pamarang Torc / Chest Ornaments -->
  <rect x="29" y="13" width="12" height="10" fill="#b45309"/>
  <rect x="32" y="14" width="6" height="3" fill="#fbbf24"/>
  <rect x="33" y="17" width="4" height="4" fill="#92400e"/>

  <!-- Traditional Bahag (Visayan red loincloth with gold borders) -->
  <rect x="30" y="23" width="10" height="8" fill="#dc2626"/>
  <rect x="33" y="24" width="4" height="10" fill="#f59e0b"/>
  
  <!-- Bronze Legs -->
  <rect x="30" y="31" width="4" height="11" fill="#b45309"/>
  <rect x="36" y="31" width="4" height="11" fill="#92400e"/>

  <!-- Raised Right Arm holding Kampan/Kampilan Sword -->
  <rect x="41" y="13" width="6" height="4" fill="#b45309"/>
  <rect x="45" y="9" width="3" height="6" fill="#b45309"/>
  <!-- Kampilan Sword (Long Visayan single-edged blade) -->
  <rect x="45" y="4" width="2" height="6" fill="#78350f"/>
  <rect x="44" y="1" width="4" height="4" fill="#fbbf24"/>
  <rect x="45" y="0" width="2" height="20" fill="#e2e8f0"/>
  <rect x="47" y="0" width="1" height="16" fill="#94a3b8"/>
  <rect x="45" y="0" width="4" height="3" fill="#f8fafc"/>

  <!-- Left Arm holding Carved Wooden Shield (Kalasag) -->
  <rect x="24" y="14" width="5" height="4" fill="#b45309"/>
  <!-- Hexagonal Kalasag Shield with Visayan geometric patterns -->
  <rect x="20" y="12" width="6" height="22" fill="#78350f"/>
  <rect x="18" y="16" width="10" height="14" fill="#92400e"/>
  <rect x="22" y="15" width="2" height="16" fill="#fbbf24"/>

  <!-- Tiered Coral-Stone Monument Pedestal (Mactan Shrine Obelisk Base) -->
  <rect x="24" y="42" width="22" height="5" fill="#e2e8f0"/>
  <rect x="20" y="47" width="30" height="8" fill="#cbd5e1"/>
  <!-- Dedication Plaque on Pedestal -->
  <rect x="26" y="49" width="18" height="4" fill="#f59e0b"/>
  <rect x="28" y="50" width="14" height="2" fill="#451a03"/>

  <!-- Mid-stage pedestal blocks -->
  <rect x="16" y="55" width="38" height="16" fill="#e2e8f0"/>
  <rect x="18" y="57" width="34" height="12" fill="#cbd5e1"/>
  
  <!-- Foundation Steps -->
  <rect x="12" y="71" width="46" height="6" fill="#94a3b8"/>
  <rect x="8" y="77" width="54" height="7" fill="#64748b"/>
  <rect x="4" y="84" width="62" height="8" fill="#475569"/>
  <rect x="2" y="92" width="66" height="8" fill="#334155"/>

  <!-- Tropical Plumeria blossoms at foot of shrine -->
  <rect x="10" y="75" width="4" height="4" fill="#fef08a"/>
  <rect x="9" y="76" width="6" height="2" fill="#ffffff"/>
  <rect x="54" y="81" width="4" height="4" fill="#fef08a"/>
  <rect x="53" y="82" width="6" height="2" fill="#fda4af"/>
</svg>