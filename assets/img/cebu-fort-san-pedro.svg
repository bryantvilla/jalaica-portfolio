<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 88" width="80" height="88" shape-rendering="crispEdges">
  <!-- Spanish / Visayan Red & Gold Flag on Parapet -->
  <rect x="23" y="4" width="2" height="14" fill="#78350f"/>
  <rect x="25" y="4" width="10" height="3" fill="#dc2626"/>
  <rect x="25" y="7" width="10" height="3" fill="#fbbf24"/>
  <rect x="25" y="10" width="10" height="3" fill="#dc2626"/>

  <!-- Stone Battlements / Crenellations -->
  <rect x="14" y="18" width="8" height="8" fill="#e2e8f0"/>
  <rect x="28" y="18" width="8" height="8" fill="#cbd5e1"/>
  <rect x="42" y="18" width="8" height="8" fill="#cbd5e1"/>
  <rect x="56" y="18" width="8" height="8" fill="#94a3b8"/>

  <!-- Main Stone Rampart Wall -->
  <rect x="12" y="26" width="56" height="8" fill="#cbd5e1"/>
  <rect x="14" y="34" width="52" height="36" fill="#e2e8f0"/>
  <rect x="12" y="34" width="4" height="36" fill="#f8fafc"/>
  <rect x="64" y="34" width="4" height="36" fill="#64748b"/>

  <!-- Miniature Historic Bronze Cannon pointing right -->
  <rect x="52" y="21" width="14" height="4" fill="#1e293b"/>
  <rect x="50" y="22" width="3" height="3" fill="#d97706"/>
  <rect x="64" y="22" width="2" height="2" fill="#0f172a"/>
  <!-- Cannon Wheels -->
  <rect x="52" y="25" width="4" height="3" fill="#92400e"/>

  <!-- Fort Entrance Archway (Arco sa Kutang San Pedro) -->
  <rect x="31" y="42" width="18" height="6" fill="#334155"/>
  <rect x="28" y="48" width="24" height="22" fill="#334155"/>
  <!-- Heavy Spanish Timber Doors with studs -->
  <rect x="30" y="49" width="10" height="21" fill="#78350f"/>
  <rect x="40" y="49" width="10" height="21" fill="#451a03"/>
  <rect x="32" y="54" width="2" height="2" fill="#fbbf24"/>
  <rect x="38" y="54" width="2" height="2" fill="#fbbf24"/>
  <rect x="32" y="62" width="2" height="2" fill="#fbbf24"/>
  <rect x="38" y="62" width="2" height="2" fill="#fbbf24"/>

  <!-- Spanish Coat of Arms / Plaque above Arch -->
  <rect x="34" y="34" width="12" height="6" fill="#fef08a"/>
  <rect x="36" y="35" width="8" height="4" fill="#dc2626"/>
  <rect x="38" y="36" width="4" height="2" fill="#fbbf24"/>

  <!-- Coral Stone Foundation Steps -->
  <rect x="8" y="70" width="64" height="4" fill="#cbd5e1"/>
  <rect x="6" y="74" width="68" height="4" fill="#94a3b8"/>
  <rect x="4" y="78" width="72" height="4" fill="#64748b"/>

  <!-- Tropical Palm & Bougainvillea foliage flanking fort -->
  <!-- Palm on right -->
  <rect x="68" y="45" width="3" height="16" fill="#78350f"/>
  <rect x="64" y="38" width="12" height="3" fill="#15803d"/>
  <rect x="60" y="35" width="18" height="3" fill="#22c55e"/>
  <rect x="66" y="32" width="8" height="3" fill="#4ade80"/>
  <!-- Bougainvillea on left -->
  <rect x="14" y="42" width="3" height="3" fill="#f43f5e"/>
  <rect x="12" y="46" width="4" height="3" fill="#fda4af"/>
  <rect x="15" y="50" width="3" height="3" fill="#f43f5e"/>
</svg>