<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 76 96" width="76" height="96" shape-rendering="crispEdges">
  <!-- Windmill Blades (White with red tips) -->
  <!-- Top blade -->
  <rect x="36" y="4" width="4" height="20" fill="#ffffff"/>
  <rect x="36" y="2" width="4" height="4" fill="#dc2626"/>
  <rect x="37" y="6" width="2" height="16" fill="#94a3b8"/>
  <!-- Bottom blade -->
  <rect x="36" y="30" width="4" height="20" fill="#ffffff"/>
  <rect x="36" y="48" width="4" height="4" fill="#dc2626"/>
  <rect x="37" y="32" width="2" height="16" fill="#94a3b8"/>
  <!-- Left blade -->
  <rect x="14" y="24" width="20" height="4" fill="#ffffff"/>
  <rect x="12" y="24" width="4" height="4" fill="#dc2626"/>
  <rect x="16" y="25" width="16" height="2" fill="#94a3b8"/>
  <!-- Right blade -->
  <rect x="42" y="24" width="20" height="4" fill="#ffffff"/>
  <rect x="60" y="24" width="4" height="4" fill="#dc2626"/>
  <rect x="44" y="25" width="16" height="2" fill="#94a3b8"/>

  <!-- Rotor Hub -->
  <rect x="34" y="22" width="8" height="8" fill="#475569"/>
  <rect x="36" y="24" width="4" height="4" fill="#fbbf24"/>

  <!-- Windmill Cap (Green/Mint cone roof) -->
  <rect x="33" y="20" width="10" height="4" fill="#059669"/>
  <rect x="30" y="24" width="16" height="4" fill="#10b981"/>
  <rect x="28" y="28" width="20" height="3" fill="#047857"/>

  <!-- Windmill Body / Tower (Vibrant Coral-Red Dutch brick tower with white balconies) -->
  <rect x="30" y="31" width="16" height="38" fill="#f43f5e"/>
  <rect x="28" y="31" width="3" height="38" fill="#fda4af"/>
  <rect x="45" y="31" width="3" height="38" fill="#be123c"/>

  <!-- Balcony railing -->
  <rect x="24" y="44" width="28" height="3" fill="#ffffff"/>
  <rect x="25" y="41" width="2" height="3" fill="#ffffff"/>
  <rect x="31" y="41" width="2" height="3" fill="#ffffff"/>
  <rect x="43" y="41" width="2" height="3" fill="#ffffff"/>
  <rect x="49" y="41" width="2" height="3" fill="#ffffff"/>

  <!-- Windows & Door -->
  <rect x="35" y="35" width="6" height="6" fill="#fef08a"/>
  <rect x="37" y="35" width="2" height="6" fill="#78350f"/>
  <rect x="35" y="37" width="6" height="2" fill="#78350f"/>

  <rect x="35" y="56" width="6" height="13" fill="#78350f"/>
  <rect x="36" y="58" width="4" height="11" fill="#451a03"/>

  <!-- Grassy Hillock Base -->
  <rect x="18" y="69" width="40" height="6" fill="#15803d"/>
  <rect x="12" y="75" width="52" height="8" fill="#166534"/>
  <rect x="8" y="83" width="60" height="8" fill="#14532d"/>

  <!-- Vibrant Sirao Celosia Flowers (Red, Yellow, Orange, & Pink flower flames) -->
  <rect x="12" y="72" width="3" height="5" fill="#f43f5e"/>
  <rect x="17" y="70" width="3" height="6" fill="#f59e0b"/>
  <rect x="22" y="73" width="3" height="5" fill="#fb7185"/>
  <rect x="51" y="71" width="3" height="6" fill="#e11d48"/>
  <rect x="56" y="73" width="3" height="5" fill="#fde047"/>
  <rect x="61" y="70" width="3" height="6" fill="#f43f5e"/>
  <rect x="10" y="79" width="4" height="4" fill="#fbbf24"/>
  <rect x="62" y="78" width="4" height="5" fill="#f472b6"/>
