<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a1d25"/>
      <stop offset="50%" stop-color="#1e141a"/>
      <stop offset="100%" stop-color="#140d12"/>
    </linearGradient>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8b4c4"/>
      <stop offset="50%" stop-color="#f39eb2"/>
      <stop offset="100%" stop-color="#d9758d"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fae3d9"/>
      <stop offset="100%" stop-color="#e8a8b8"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#f39eb2" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#f39eb2" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#140d12" stop-opacity="0"/>
    </radialGradient>
    <pattern id="hexGrid" width="40" height="69.282" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 20 11.547 L 0 0 L 0 23.094 L 20 34.641 L 40 23.094 Z M 0 34.641 L 20 46.188 L 40 34.641 L 40 57.735 L 20 69.282 L 0 57.735 Z" fill="none" stroke="#f39eb2" stroke-width="0.75" stroke-opacity="0.08"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="600" height="600" rx="16" fill="url(#bgGrad)"/>
  <rect width="600" height="600" rx="16" fill="url(#hexGrid)"/>
  <circle cx="300" cy="270" r="240" fill="url(#glow)"/>

  <!-- Precision Measurement / Calibration concentric circles -->
  <circle cx="300" cy="250" r="170" fill="none" stroke="#f39eb2" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="4 6"/>
  <circle cx="300" cy="250" r="140" fill="none" stroke="#f39eb2" stroke-width="1.5" stroke-opacity="0.4"/>
  <circle cx="300" cy="250" r="110" fill="none" stroke="#f39eb2" stroke-width="1" stroke-opacity="0.2"/>

  <!-- Compass / Crosshair marks -->
  <line x1="300" y1="65" x2="300" y2="85" stroke="#f39eb2" stroke-width="2" stroke-opacity="0.6"/>
  <line x1="300" y1="415" x2="300" y2="435" stroke="#f39eb2" stroke-width="2" stroke-opacity="0.6"/>
  <line x1="115" y1="250" x2="135" y2="250" stroke="#f39eb2" stroke-width="2" stroke-opacity="0.6"/>
  <line x1="465" y1="250" x2="485" y2="250" stroke="#f39eb2" stroke-width="2" stroke-opacity="0.6"/>

  <!-- Monogram Centerpiece -->
  <circle cx="300" cy="250" r="88" fill="#241921" stroke="url(#roseGrad)" stroke-width="2.5"/>
  <text x="300" y="278" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="76" font-weight="700" fill="url(#roseGrad)" letter-spacing="-2">JJ</text>

  <!-- Surrounding Badges / Medical device domain markers -->
  <g transform="translate(300, 250)">
    <!-- Top badge: ISO 13485 -->
    <rect x="-56" y="-192" width="112" height="26" rx="13" fill="#2d1e28" stroke="#f39eb2" stroke-width="1" stroke-opacity="0.5"/>
    <text x="0" y="-175" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="11" font-weight="650" fill="#f8b4c4" letter-spacing="1.2">ISO 13485</text>

    <!-- Bottom badge: 21 CFR 820 -->
    <rect x="-60" y="166" width="120" height="26" rx="13" fill="#2d1e28" stroke="#f39eb2" stroke-width="1" stroke-opacity="0.5"/>
    <text x="0" y="183" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="11" font-weight="650" fill="#f8b4c4" letter-spacing="1.2">21 CFR 820</text>

    <!-- Left badge: V&V / TMV -->
    <rect x="-240" y="-13" width="94" height="26" rx="13" fill="#2d1e28" stroke="#f39eb2" stroke-width="1" stroke-opacity="0.5"/>
    <text x="-193" y="4" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="11" font-weight="650" fill="#f8b4c4" letter-spacing="1.2">TMV · CCIT</text>

    <!-- Right badge: COMBINATION PRODUCTS -->
    <rect x="146" y="-13" width="96" height="26" rx="13" fill="#2d1e28" stroke="#f39eb2" stroke-width="1" stroke-opacity="0.5"/>
    <text x="194" y="4" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="11" font-weight="650" fill="#f8b4c4" letter-spacing="1.2">SHL MEDICAL</text>
  </g>

  <!-- Bottom Details & Typography -->
  <g transform="translate(0, 480)">
    <line x1="60" y1="0" x2="540" y2="0" stroke="#f39eb2" stroke-width="1" stroke-opacity="0.2"/>
    <text x="300" y="32" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="20" font-weight="700" fill="#ffffff" letter-spacing="-0.5">JALAICA JARAMILLO</text>
    <text x="300" y="56" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="12" font-weight="600" fill="#f39eb2" letter-spacing="2.5">BIOMEDICAL &amp; ANALYTICAL SCIENCES</text>
    <text x="300" y="80" text-anchor="middle" font-family="'Manrope', sans-serif" font-size="11" font-weight="450" fill="#a4939d">Florida International University · Deerfield Beach, FL</text>
  </g>
</svg>
